; ==========================================================================
; Practica #6 - Diseño Electronico (MQTT en AWS: Mosquitto + Node-RED en EC2)
; Proyecto PlatformIO para la placa TTGO T-Display (ESP32).
;
; Un mismo proyecto genera DOS firmwares, uno por entorno:
;
;   sensor     -> lee el DHT11, publica telemetria y el estado del boton (sw),
;                 y obedece a led1/led2 desde el dashboard.
;   observador -> no tiene sensor: solo se suscribe y muestra lo que publica
;                 el sensor. Es el segundo cliente de la arquitectura.
;
; Compilar/cargar uno concreto:   pio run -e observador -t upload
; Sin -e se compila solo "sensor" (default_envs).
; ==========================================================================

[platformio]
default_envs = sensor

; --------------------------------------------------------------------------
; Configuracion comun a los dos entornos
; --------------------------------------------------------------------------
[env]
platform  = espressif32
board     = lilygo-t-display
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
	knolleary/PubSubClient@^2.8
	bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI configurada por build flags (igual que en la practica 05): el
; proyecto compila recien clonado, sin tocar User_Setup_Select.h.
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DCGRAM_OFFSET=1
	-DTFT_MISO=-1
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=6000000

; --------------------------------------------------------------------------
; Cliente 1: dispositivo con sensor (publica y se suscribe)
; --------------------------------------------------------------------------
[env:sensor]
build_src_filter = +<comun/> +<sensor/>
lib_deps =
	${env.lib_deps}
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14

; --------------------------------------------------------------------------
; Cliente 2: observador (solo se suscribe)
; --------------------------------------------------------------------------
[env:observador]
build_src_filter = +<comun/> +<observador/>
