# ==========================================================================
# /etc/mosquitto/conf.d/default.conf  -  Practica #6 (Diseño Electronico)
#
# Mosquitto en la instancia EC2. El archivo principal de Ubuntu,
# /etc/mosquitto/mosquitto.conf, ya incluye todo lo que haya en conf.d/ y
# activa la persistencia, asi que aqui solo va lo propio de la practica.
# ==========================================================================

# Escuchar en el puerto 1883 en TODAS las interfaces. Sin un listener
# explicito, Mosquitto 2.x solo acepta conexiones desde la propia maquina.
listener 1883

# La guia usa "allow_anonymous true". Eso es aceptable en la red local de la
# practica 05, pero aqui el puerto queda abierto a Internet: cualquiera que
# encuentre la IP podria leer y publicar en todos los topicos. Por eso se
# exige usuario y contraseña.
allow_anonymous false

# Archivo de usuarios creado con mosquitto_passwd (claves guardadas con hash).
password_file /etc/mosquitto/passwd
