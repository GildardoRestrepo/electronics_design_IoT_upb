; ==========================================================================
; Practica #5 - Diseño Electronico (MQTT local: Mosquitto + Node-RED)
; Proyecto PlatformIO para la placa TTGO T-Display (ESP32).
; ==========================================================================

[env:lilygo-t-display]
platform  = espressif32
board     = lilygo-t-display
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Las versiones quedan fijadas para que el proyecto compile igual dentro de
; unos meses, aunque las librerias publiquen versiones nuevas.
lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	bodmer/TFT_eSPI@^2.5.43

; --------------------------------------------------------------------------
; Configuracion de TFT_eSPI por build flags.
;
; En las practicas anteriores habia que entrar a User_Setup_Select.h DENTRO de
; la libreria y descomentar Setup25_TTGO_T_Display.h a mano. Eso significaba
; que el repositorio no era autosuficiente: quien lo clonara tenia que repetir
; ese paso o no le compilaba.
;
; Definiendo USER_SETUP_LOADED=1 la libreria ignora sus archivos de setup y usa
; estos flags, que si estan versionados. El proyecto compila en cualquier
; maquina sin tocar nada.
; --------------------------------------------------------------------------
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DCGRAM_OFFSET=1
	-DTFT_MISO=-1
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=6000000
